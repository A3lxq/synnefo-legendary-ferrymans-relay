[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:poller]
command=/opt/poller.sh
# Debian's packaged docker.io CLI auto-negotiates an old API version
# that a typical (newer) Docker daemon now refuses outright. Forcing a
# version here is the standard workaround, inherited by every payload
# the poller executes.
environment=DOCKER_API_VERSION="1.44"
autorestart=true
